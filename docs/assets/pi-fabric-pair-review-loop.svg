<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="title desc">
  <title id="title">Pair review loop</title>
  <desc id="desc">The worker implements a change and reports. The controller captures evidence and configured check results. Main inspects the checkpoint, then approves it or requests a revision in the same worker session.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#667085" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="248" fill="#fff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#202936" text-anchor="middle">
    <g font-size="15" fill="#667085">
      <text x="111" y="43">Worker</text>
      <text x="360" y="43">Controller</text>
      <text x="609" y="43">Main</text>
      <text x="847" y="43">Main</text>
    </g>
    <g fill="#fff" stroke="#b8c1cc" stroke-width="1.2">
      <rect x="24" y="64" width="174" height="84" rx="4"/>
      <rect x="522" y="64" width="174" height="84" rx="4"/>
      <rect x="758" y="64" width="178" height="84" rx="4"/>
    </g>
    <rect x="260" y="64" width="200" height="84" rx="4" fill="#f4f7fa" stroke="#8fa5bb" stroke-width="1.2"/>
    <g font-size="20" font-weight="500">
      <text x="111" y="113">Implement</text>
      <text x="360" y="101">Capture evidence</text>
      <text x="609" y="113">Inspect</text>
      <text x="847" y="113">Approve</text>
    </g>
    <text x="360" y="124" font-size="15" fill="#667085">diff + checks</text>
    <g fill="none" stroke="#667085" stroke-width="1.4" marker-end="url(#arrow)">
      <path d="M208 106H250"/>
      <path d="M470 106H512"/>
      <path d="M706 106H748"/>
      <path d="M609 158V190Q609 200 599 200H121Q111 200 111 190V158"/>
    </g>
    <g font-size="15" fill="#667085">
      <text x="229" y="91">report</text>
      <text x="360" y="225">revise in the same session</text>
    </g>
  </g>
</svg>
