<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-labelledby="title desc">
  <title id="title">Separate conversations, retained worker history</title>
  <desc id="desc">Main's conversation continues through planning and review. The worker keeps its own session through a task, a revision, and the next task. The two rows summarize each conversation's progression, not exact event timing.</desc>
  <defs>
    <marker id="main-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#98a2b3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="worker-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#54718f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="236" fill="#fff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#202936">
    <text x="36" y="78" font-size="20" font-weight="500">Main</text>
    <text x="36" y="101" font-size="15" fill="#667085">conversation</text>
    <text x="36" y="177" font-size="20" font-weight="500">Worker</text>
    <text x="36" y="200" font-size="15" fill="#667085">same session</text>
    <path d="M240 82H918" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#main-arrow)"/>
    <path d="M240 181H918" fill="none" stroke="#54718f" stroke-width="1.4" marker-end="url(#worker-arrow)"/>
    <g fill="#fff" stroke="#98a2b3" stroke-width="1.5">
      <circle cx="282" cy="82" r="5"/>
      <circle cx="548" cy="82" r="5"/>
      <circle cx="814" cy="82" r="5"/>
    </g>
    <g fill="#f4f7fa" stroke="#54718f" stroke-width="1.5">
      <circle cx="282" cy="181" r="5"/>
      <circle cx="548" cy="181" r="5"/>
      <circle cx="814" cy="181" r="5"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="282" y="57">Plan</text>
      <text x="548" y="57">Review</text>
      <text x="814" y="57">Next plan</text>
      <text x="282" y="156">Task 1</text>
      <text x="548" y="156">Revision</text>
      <text x="814" y="156">Task 2</text>
    </g>
  </g>
</svg>
